name: build & release server tarball

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable version tag (vX.Y.Z) on release history
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate the immutable source tag
        id: source
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          COMMIT=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$COMMIT" origin/release
          git checkout --detach "$COMMIT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "VITE_PROJECT_VERSION=$TAG" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: 11.0.9
          run_install: false
      - name: Refuse to overwrite any existing release
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: node scripts/assert-new-release.cjs
      - name: Install locked dependencies
        run: |
          pnpm --dir backend install --frozen-lockfile
          pnpm --dir frontend-local install --frozen-lockfile
      - name: Backend and deployment tests
        run: |
          pnpm --dir backend test
          node --test test/management/*.test.cjs
      - name: Build backend
        run: pnpm --dir backend bundle:esbuild
      - name: Frontend locale, type and production checks
        run: |
          pnpm --dir frontend-local check:locales
          pnpm --dir frontend-local build
      - name: Package and start the exact release
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          node scripts/package-release.cjs
          node scripts/smoke-release.cjs
      - name: Publish complete assets without overwriting
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
        run: |
          node scripts/assert-new-release.cjs
          gh release create "$RELEASE_TAG" --repo ywainzh/Sub-Store --verify-tag --draft --title "Sub-Store $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md out/sub-store-server-"$RELEASE_TAG".tar.gz out/release-manifest.json out/checksums.txt
          gh release edit "$RELEASE_TAG" --repo ywainzh/Sub-Store --draft=false --latest
